    const grid = document.getElementById('occupation-main-grid');
    const statsOrder = ["captura","tatica","retencao","vigor","fuga","percepcao","afinidade","mobilidade"];
    const statsLabels = ["CAPTURA","TÁTICA","RETENÇÃO","VIGOR","FUGA","PERCEPÇÃO","AFINIDADE","MOBILIDADE"];

    function generateStarsHTML(values) {
        let html = '';
        statsOrder.forEach((stat, i) => {
            const value = values[stat] || 0;
            let stars = '';
            for (let s = 0; s < 3; s++) {
                stars += `<i class="fas fa-star ${s < value ? 'active' : ''}"></i>`;
            }
            html += `<div class="stat-row"><span>${statsLabels[i]}</span><div class="stars">${stars}</div></div>`;
        });
        return html;
    }

    function plainTextHTML(items) {
        if (!items || items.length === 0) return '<div style="color:#555; font-style:italic;">—</div>';
        return items.map(item => `<div class="vant-item">${item}</div>`).join('');
    }

    function updateOccupationCard(entry, data, typeName) {
        const config = typeLib[typeName];
        entry.style.setProperty('--type-color', config.c);
        entry.style.setProperty('--type-glow', config.glow);
        entry.querySelector('.type-icon').src = config.i;
        entry.querySelector('.type-label').innerText = config.n;
        entry.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        const activeDot = Array.from(entry.querySelectorAll('.dot')).find(dot => dot.getAttribute('onclick').includes(`'${typeName}'`));
        if (activeDot) activeDot.classList.add('active');
        entry.querySelector('.class-title').innerText = data.title;
        entry.querySelector('.description').innerText = data.desc;
        const overlayImg = entry.querySelector('.trainer-overlay');
        const overlaySrc = data.overlaysPorTipo[typeName] ? data.overlaysPorTipo[typeName][0] : '';
        if (overlayImg) {
            overlayImg.src = overlaySrc;
            overlayImg.style.display = overlaySrc ? 'block' : 'none';
        }
        entry.querySelectorAll('.vant-desv')[0].innerHTML = `<span class="vant-title">VANTAGENS:</span>${plainTextHTML(data.vantagensPorTipo[typeName] || [])}`;
        entry.querySelectorAll('.vant-desv')[1].innerHTML = `<span class="vant-title">DESVANTAGENS:</span>${plainTextHTML(data.desvantagensPorTipo[typeName] || [])}`;
        const infoBoxes = entry.querySelectorAll('.info-box');
        infoBoxes[0].innerHTML = `<span class="box-title">EQUIPE</span>${plainTextHTML(data.equipePorTipo[typeName] || [])}`;
        infoBoxes[1].innerHTML = `<span class="box-title">MOCHILA</span>${plainTextHTML(data.mochilaPorTipo[typeName] || [])}`;
        entry.querySelector('.stats-grid').innerHTML = `<span class="vant-title">ATRIBUTOS</span><br>${generateStarsHTML(data.atributosPorTipo[typeName] || {})}<br>`;
    }

    window.switchVariantTab = function(el, groupKey, variantName) {
        const entry = el.closest('.occupation-entry');
        entry.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        const group = occupationGroups[groupKey];
        const data = group.variants[variantName];
        const typeName = data.types[0];
        updateOccupationCard(entry, data, typeName);
    };

        const initialData = group.variants[initialVariantName];
        const initialType = initialData.types[0];
        const config = typeLib[initialType];
        const entry = document.createElement('div');
        entry.className = 'occupation-entry';
        entry.dataset.group = groupKey;
        entry.innerHTML = `
            <div class="class-card">
                <div class="scan-effect"></div>
                <div class="unova-side">
                    <div class="type-circle">
                        <img class="type-icon" src="${config.i}">
                        <img class="trainer-overlay" src="${initialData.overlaysPorTipo[initialType] ? initialData.overlaysPorTipo[initialType][0] : ''}" style="display: ${initialData.overlaysPorTipo[initialType] ? 'block' : 'none'};">
                    </div>
                    <div class="type-dots">${initialData.types.map(t => `<div class="dot active" onclick="updateOccupationCard(this.closest('.occupation-entry'), occupationGroups['${groupKey}'].variants['${initialVariantName}'], '${t}')"></div>`).join('')}</div>
                </div>
                <div class="content-card">
                    <span class="type-label">${config.n}</span>
                    <h2 class="class-title">${initialData.title}</h2>
                    <p class="description">${initialData.desc}</p>
                    <div class="vant-desv"><span class="vant-title">VANTAGENS:</span>${plainTextHTML(initialData.vantagensPorTipo[initialType] || [])}</div>
                    <div class="vant-desv"><span class="vant-title">DESVANTAGENS:</span>${plainTextHTML(initialData.desvantagensPorTipo[initialType] || [])}</div>
                    <div class="stats-grid"><span class="vant-title">ATRIBUTOS</span><br>${generateStarsHTML(initialData.atributosPorTipo[initialType] || {})}<br></div>
                </div>
            </div>
            <div class="tab-container">
                ${Object.keys(group.variants).map(variant => `<div class="tab-btn ${variant === initialVariantName ? 'active' : ''}" onclick="switchVariantTab(this, '${groupKey}', '${variant}')">${variant}</div>`).join('')}
            </div>
            <div class="data-boxes">
                <div class="info-box"><span class="box-title">EQUIPE</span>${plainTextHTML(initialData.equipePorTipo[initialType] || [])}</div>
                <div class="info-box"><span class="box-title">MOCHILA</span>${plainTextHTML(initialData.mochilaPorTipo[initialType] || [])}</div>
            </div>
        `;
        grid.appendChild(entry);
        updateOccupationCard(entry, initialData, initialType);
    });
</script>
    </div>
    <div class="indicador">
        <p id="indicadorText"></p>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            var titleElement = document.title;
            var intervalId;
            var repetitions = 3;
            var currentRepetition = 0;
            function startTitleAnimation() {
                var title = ": Virtual Links!";
                var index = 0;
                intervalId = setInterval(function () {
                    document.title = "POKÉMON" + title.substring(0, index);
                    index++;
                    if (index > title.length) {
                        clearInterval(intervalId);
                        setTimeout(function () {
                            currentRepetition++;
                            if (currentRepetition < repetitions) {
                                startTitleAnimation();
                            } else {
                                currentRepetition = 0;
                                setTimeout(function () {
                                    startTitleAnimation();
                                }, 1000);
                            }
                        }, 1000);
                    }
                }, 150);
            }
            startTitleAnimation();
        });
    </script>
    <script>
        function updateClockAndDate() {
            var now = new Date();
            var futureDate = new Date(now.getFullYear() + 100, now.getMonth(), now.getDate());
            var optionsDate = { month: 'short', day: 'numeric', year: 'numeric' };
            var dateString = futureDate.toLocaleDateString('en-US', optionsDate);
            document.getElementById('date').innerText = dateString;
            var tokyoTime = new Date(new Date().toLocaleString("en-US", {timeZone: "Asia/Tokyo"}));
            var hours = tokyoTime.getHours();
            var minutes = tokyoTime.getMinutes();
            var seconds = tokyoTime.getSeconds();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            var timeString = hours + ':' + minutes + ':' + seconds;
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClockAndDate, 1000);
        updateClockAndDate();
    </script>
    <script>
        function changeText(text) {
            var indicadorText = document.getElementById('indicadorText');
            indicadorText.innerHTML = text;
            var indicador = document.querySelector('.indicador');
            indicador.style.display = (text !== '') ? 'flex' : 'none';
        }
        function hideIndicador() {
            var indicador = document.querySelector('.indicador');
            indicador.style.display = 'none';
        }
        const buttonConfigs = [
            { id: 'pokedex', text: 'POKÉDEX' },
            { id: 'pokemon', text: 'POKÉMON' },
            { id: 'mochila', text: 'MOCHILA' },
            { id: 'mercado', text: 'MERCADO' },
            { id: 'salvar', text: 'SALVAR' },
            { id: 'presentes', text: 'PRESENTES' },
            { id: 'mapa', text: 'MAPA' },
            { id: 'desafios', text: 'CONQUISTAS' },
            { id: 'alertas', text: 'NOTIFICAÇÕES' },
            { id: 'treinador', text: 'TREINADOR' },
            { id: 'classificacao', text: 'CLASSIFICAÇÃO' },
            { id: 'ovos', text: 'OVOS' }
        ];
        buttonConfigs.forEach(config => {
            const el = document.getElementById(config.id);
            if (el) {
                el.addEventListener('mouseover', () => changeText(config.text));
                el.addEventListener('mouseout', hideIndicador);
            }
        });
    </script>
    <script>
        document.addEventListener('contextmenu', event => {
            event.preventDefault();
            document.elementFromPoint(event.clientX, event.clientY).click();
        });
        document.onkeydown = function(e) {
            if (e.ctrlKey || e.altKey || e.shiftKey) {
                return false;
            }
        };
        document.onselectstart = function() {
            return false;
        };
        document.oncopy = function() {
            return false;
        };
        document.oncut = function() {
            return false;
        };
        document.ondragstart = function() {
            return false;
        };
    </script>
